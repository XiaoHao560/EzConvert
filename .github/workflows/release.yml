name: release
on:
 push:
   tags: [ 'v*' ]

jobs:
 build:
   runs-on: ubuntu-latest
   permissions:
     contents: write
     pull-requests: read
   steps:
     - name: 检出代码
       uses: actions/checkout@v4
       with:
         fetch-depth: 0
         
     - name: 下载 FFmpegKit AAR (gh)
       env:
         GITHUB_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
       run: |
         mkdir -p libs
         gh release download v9.0.1 \
         --repo XiaoHao560/ffmpeg-kit-next \
         --pattern "*.zip" \
         --output ffmpeg-kit-next.zip
         unzip -q ffmpeg-kit-next.zip -d libs/

     - name: 配置 JDK 17
       uses: actions/setup-java@v4
       with: 
         distribution: temurin
         java-version: 17
         
     - name: 初始化 Gradle
       uses: gradle/actions/setup-gradle@v4

     - name: 提取标签并查找更新日志
       id: changelog
       run: |
         TAG_NAME="${{ github.ref_name }}"
         echo "Current tag: $TAG_NAME"
         
         if [[ "$TAG_NAME" =~ ^(v[0-9]+)\. ]]; then
           MAJOR="${BASH_REMATCH[1]}"
           VERSION_DIR="${MAJOR}.0.0"
         else
           VERSION_DIR="v0.0.0"
         fi
         
         CHANGELOG_FILE="change_log/${VERSION_DIR}/${TAG_NAME}.md"
         echo "Looking for changelog file: $CHANGELOG_FILE"
         
         if [ -f "$CHANGELOG_FILE" ]; then
           echo "Changelog file found"
           echo "changelog_exists=true" >> $GITHUB_OUTPUT
           cat "$CHANGELOG_FILE" > release_body.md
         else
           echo "Warning: Changelog file $CHANGELOG_FILE not found"
           echo "changelog_exists=false" >> $GITHUB_OUTPUT
           echo "## $TAG_NAME" > release_body.md
           echo "" >> release_body.md
           echo "> 自动构建版本，详情请查看项目文档。" >> release_body.md
         fi

     - name: 生成贡献者列表
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       shell: bash
       run: |
         set -euo pipefail
         TAG_NAME="${{ github.ref_name }}"
         echo "查找 $TAG_NAME 之前的最近一个标签"

         PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
         declare -A contributors=()

         if [[ -n "$PREVIOUS_TAG" ]]; then
           echo "使用上一个标签作为比较起点：$PREVIOUS_TAG"

           while IFS= read -r commit; do
             [[ -z "$commit" ]] && continue

             # 查询与该提交关联且已合并的 PR，并按 PR 编号去重
             pr_data="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}/pulls" \
               --jq '.[] | select(.merged_at != null) | [.number, .user.login] | @tsv')"

             while IFS=$'\t' read -r pr_number login; do
               [[ -z "${pr_number:-}" || -z "${login:-}" ]] && continue
               if [[ -z "${contributors[$pr_number]+x}" ]]; then
                 contributors["$pr_number"]="$login"
               fi
             done <<< "$pr_data"
           done < <(git rev-list --reverse "${PREVIOUS_TAG}..${TAG_NAME}")
         else
           echo "未找到上一个标签，将显示空的贡献者列表"
         fi

         # 保留现有正文，只规范结尾换行，再追加一个空行和贡献者标题
         python3 - <<'PYBODY'
         from pathlib import Path

         path = Path("release_body.md")
         body = path.read_text(encoding="utf-8").rstrip("\r\n")
         path.write_text(body + "\n\n### contributors\n", encoding="utf-8")
         PYBODY

         if (( ${#contributors[@]} == 0 )); then
           printf '暂无贡献者记录\n' >> release_body.md
         else
           # 按用户名分组；同一贡献者的多个 PR 合并到同一行
           declare -A contributor_prs=()
           for pr_number in "${!contributors[@]}"; do
             login="${contributors[$pr_number]}"
             if [[ -n "${contributor_prs[$login]+x}" ]]; then
               contributor_prs["$login"]+=", #$pr_number"
             else
               contributor_prs["$login"]="#$pr_number"
             fi
           done

           # 按用户名排序，保持每位贡献者的 PR 编号升序
           while IFS=$'\t' read -r login pr_list; do
             [[ -z "${login:-}" || -z "${pr_list:-}" ]] && continue
             printf '@%s in %s\n' "$login" "$pr_list" >> release_body.md
           done < <(
             for login in "${!contributor_prs[@]}"; do
               printf '%s\t%s\n' "$login" "${contributor_prs[$login]}"
             done | sort
           )
         fi

     - name: 判断构建变体
       id: variant
       run: |
         TAG_NAME="${{ github.ref_name }}"
         echo "Checking tag: $TAG_NAME"
         
         if [[ "$TAG_NAME" == *"-alpha"* ]] || \
            [[ "$TAG_NAME" == *"-beta"* ]] || \
            [[ "$TAG_NAME" == *"-rc"* ]] || \
            [[ "$TAG_NAME" == *"-debug"* ]] || \
            [[ "$TAG_NAME" =~ -alpha\.[0-9]+$ ]] || \
            [[ "$TAG_NAME" =~ -beta\.[0-9]+$ ]] || \
            [[ "$TAG_NAME" =~ -rc\.[0-9]+$ ]]; then
           echo "variant=release" >> $GITHUB_OUTPUT
           echo "is_prerelease=true" >> $GITHUB_OUTPUT
           echo "This is a pre-release version (using release build)"
         else
           echo "variant=release" >> $GITHUB_OUTPUT
           echo "is_prerelease=false" >> $GITHUB_OUTPUT
           echo "This is a release version"
         fi

     - name: Firebase 配置 (Release)
       env:
         GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
       run: |
         echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

     - name: 解码签名密钥
       run: |
         echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > xiaohao-app-key.keystore
       shell: bash

     - name: 编译多 ABI APK
       run: ./gradlew assemble${{ steps.variant.outputs.variant }}
       env:
         GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"
         KEYSTORE_FILE: ${{ github.workspace }}/xiaohao-app-key.keystore
         KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
         KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
         KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
         GITHUB_REF: ${{ github.ref }}

     - name: 检查 APK 生成情况
       run: |
         echo "检查生成的 APK 文件"
         find app/build/outputs/apk/${{ steps.variant.outputs.variant }} -name "*.apk" -type f | while read file; do
           echo "找到APK: $file"
           ls -lh "$file"
           unzip -l "$file" | grep "lib/" || echo "  无法读取ABI信息"
         done

     - name: 上传至 Github Release
       uses: softprops/action-gh-release@v2
       with:
         files: app/build/outputs/apk/${{ steps.variant.outputs.variant }}/*.apk
         tag_name: ${{ github.ref_name }}
         name: ${{ github.ref_name }}
         body_path: release_body.md
         prerelease: ${{ steps.variant.outputs.is_prerelease }}
         draft: false
